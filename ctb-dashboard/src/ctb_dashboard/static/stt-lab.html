<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STT Lab</title>
<style>
  :root {
    --sheet: #0b1220; --well: #020617; --text: #e5e7eb; --muted: #9ca3af;
    --line: #1f2937; --btn: #1a2333; --btn-hover: #243044; --accent: #10b981;
    --accent-hover: #34d399; --ok: #34d399; --warn: #fbbf24; --err: #ef4444;
    --chip-bg: #16233a; --del: #7f1d1d; --ins: #14532d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sheet); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; background: var(--sheet); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; flex: 0 0 auto; }
  #stt-progress { color: var(--muted); font-size: 13px; flex: 1; }
  .stt-toggle-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .stt-toggle-label input { width: 18px; height: 18px; }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  #stt-notice {
    background: var(--del); color: #fecaca; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
  }

  .stt-card {
    background: var(--well); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .stt-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .stt-chip {
    display: inline-block; background: var(--chip-bg); color: var(--muted);
    border-radius: 999px; padding: 3px 10px; font-size: 12px;
  }
  #stt-session-name { font-size: 12px; color: var(--muted); }
  #stt-sentence { font-size: 20px; line-height: 1.45; min-height: 3em; }

  .stt-mic-row { display: flex; justify-content: center; margin: 20px 0; }
  #stt-mic {
    width: 84px; height: 84px; border-radius: 50%; border: none;
    background: var(--accent); color: #04120b; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; cursor: pointer;
  }
  #stt-mic:disabled { background: var(--btn); color: var(--muted); }
  #stt-mic[data-listening] { background: var(--err); color: #fff; }

  #stt-status { text-align: center; min-height: 1.4em; font-size: 13px; color: var(--muted); }

  .stt-ios-block { margin-top: 18px; }
  .stt-ios-block label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  #stt-ios-box {
    width: 100%; min-height: 72px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--sheet); color: var(--text); padding: 10px 12px;
    font-size: 16px; resize: vertical;
  }
  .stt-btn-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  button.stt-btn {
    flex: 1 1 auto; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--btn); color: var(--text); font-size: 15px; cursor: pointer;
  }
  button.stt-btn:hover { background: var(--btn-hover); }
  button.stt-btn.primary { background: var(--accent); color: #04120b; border-color: var(--accent); font-weight: 600; }
  button.stt-btn.primary:hover { background: var(--accent-hover); }

  #stt-result { margin-top: 16px; }
  .stt-result-row { margin-bottom: 10px; }
  .stt-result-row .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #stt-diff { font-size: 16px; line-height: 1.6; word-break: break-word; }
  .stt-diff-del { background: var(--del); text-decoration: line-through; color: #fecaca; }
  .stt-diff-ins { background: var(--ins); color: #bbf7d0; }
  #stt-cer { font-size: 22px; font-weight: 700; }
  #stt-missed { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  #stt-missed-note { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .stt-stats-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .stt-stats-header h2 { font-size: 15px; margin: 0; }
  #stt-stats-panel { margin-top: 12px; }
  .stt-stat-cols { display: flex; gap: 16px; margin: 10px 0; }
  .stt-stat-col { flex: 1; background: var(--sheet); border-radius: 10px; padding: 10px 12px; }
  .stt-stat-col .label { font-size: 12px; color: var(--muted); }
  .stt-stat-col .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .stt-stat-row { font-size: 13px; color: var(--text); padding: 2px 0; }
  #stt-stat-missed { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .stt-stat-foot { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>STT Lab</h1>
  <span id="stt-progress">0 / 0</span>
  <label class="stt-toggle-label"><input type="checkbox" id="stt-hints-toggle"> 용어 힌트</label>
</header>

<main>
  <div id="stt-notice" hidden></div>

  <section class="stt-card">
    <div class="stt-card-top">
      <span class="stt-chip" id="stt-category"></span>
      <span id="stt-session-name" hidden></span>
    </div>
    <div id="stt-sentence">불러오는 중…</div>

    <div class="stt-mic-row">
      <button id="stt-mic" type="button" aria-label="마이크">🎤</button>
    </div>
    <div id="stt-status"></div>

    <div class="stt-ios-block">
      <label for="stt-ios-box">iOS 받아쓰기로 입력</label>
      <textarea id="stt-ios-box" placeholder="키보드의 마이크로 받아쓰기…"></textarea>
      <div class="stt-btn-row">
        <button class="stt-btn primary" id="stt-ios-score" type="button">채점</button>
      </div>
    </div>

    <div id="stt-result" hidden>
      <div class="stt-result-row">
        <div class="label">정답</div>
        <div id="stt-ref-text"></div>
      </div>
      <div class="stt-result-row">
        <div class="label">인식 결과</div>
        <div id="stt-hyp-text"></div>
      </div>
      <div class="stt-result-row">
        <div class="label">차이</div>
        <div id="stt-diff"></div>
      </div>
      <div class="stt-result-row">
        <div class="label">CER</div>
        <div id="stt-cer">--</div>
      </div>
      <div class="stt-result-row">
        <div id="stt-missed"></div>
        <div id="stt-missed-note" hidden>용어집에 추가됨</div>
      </div>
    </div>

    <div class="stt-btn-row">
      <button class="stt-btn" id="stt-retry" type="button">다시</button>
      <button class="stt-btn" id="stt-skip" type="button">건너뛰기</button>
      <button class="stt-btn primary" id="stt-next" type="button">다음</button>
    </div>
  </section>

  <section class="stt-card">
    <div class="stt-stats-header" id="stt-stats-toggle">
      <h2>통계</h2>
      <span class="stt-chip">펼치기/접기</span>
    </div>
    <div id="stt-stats-panel" hidden>
      <div class="stt-stat-cols">
        <div class="stt-stat-col">
          <div class="label">전체 (n)</div>
          <div class="value" id="stt-stat-n">--</div>
        </div>
        <div class="stt-stat-col">
          <div class="label">GPT CER</div>
          <div class="value" id="stt-stat-gpt">--</div>
        </div>
        <div class="stt-stat-col">
          <div class="label">iOS CER</div>
          <div class="value" id="stt-stat-ios">--</div>
        </div>
      </div>
      <div id="stt-stat-category"></div>
      <div class="stt-result-row">
        <div class="label">자주 놓친 용어</div>
        <div id="stt-stat-missed"></div>
      </div>
      <div class="stt-stat-foot">
        <span>용어집 크기: <span id="stt-stat-glossary">--</span></span>
        <button class="stt-btn" id="stt-rebuild" type="button">용어집·평가셋 재생성</button>
      </div>
    </div>
  </section>
</main>

<script src="/static/js/control-token.js"></script>
<script src="/static/js/stt-lab.js"></script>
</body>
</html>
